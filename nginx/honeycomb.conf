# HoneyComb v0.1 · 唯一入口
#
# 布局刻意和导航条对齐：/table/ 是任务蜂巢，/ring/ 是计时台，/ 重定向到 /table/。
# 没有登录层 —— v0.1 是单人自用版，默认只绑回环（见 compose 的 HONEYCOMB_BIND）。
# 要放到局域网/公网，请自己在前面加一层反代 + 认证，别直接把 80 暴露出去。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location = / { return 302 /table/; }

    # 任务蜂巢
    location /table/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 计时台
    location /ring/ {
        alias /usr/share/nginx/html/ring/;
        index project-task-contribution-ring.html;
        try_files $uri $uri/ /ring/project-task-contribution-ring.html;
    }

    # 共享资源（导航条 / 图标）
    location /shared/ { alias /usr/share/nginx/html/shared/; }

    # 顶栏那个"正在计时"的小芯片只打这一个端点（约 10s 一次）。
    # 它固定映射到 /api/core/views/current，出错时也回 200 + degraded，
    # 免得顶栏在后端抖动时刷一屏 console 错误。
    location = /__cockpit/current {
        proxy_pass http://api:8000/api/core/views/current;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @cockpit_degraded;
    }
    location @cockpit_degraded {
        default_type application/json;
        return 200 '{"degraded":true,"running":false}';
    }

    # 后端
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
