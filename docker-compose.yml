# HoneyComb TimeManagement · v0.1
#
# 起：docker compose up -d        停：docker compose down
# 起来之后开 http://127.0.0.1:8800/
#
# 三个服务：mongo（存数据）、api（FastAPI，事件溯源的计时与任务）、web（nginx，静态页 + 反代 /api）。
# 只有 web 映射宿主端口；mongo 和 api 只在内部网里，外面够不到。
# 数据落在 named volume honeycomb_mongo_data —— `docker compose down` 不会删它，
# 要连数据一起删是 `docker compose down -v`。
name: honeycomb

networks:
  honeycomb-net:
    driver: bridge

volumes:
  honeycomb_mongo_data:

services:
  mongo:
    image: mongo:7
    container_name: honeycomb-mongo
    restart: unless-stopped
    networks: [honeycomb-net]
    volumes:
      - honeycomb_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    image: honeycomb-api:v0.1
    container_name: honeycomb-api
    restart: unless-stopped
    networks: [honeycomb-net]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NEXUS_MONGO_URI: mongodb://mongo:27017
      NEXUS_DB_NAME: ${HONEYCOMB_DB_NAME:-honeycomb}
      NEXUS_TZ: ${HONEYCOMB_TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/core/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: nginx:alpine
    container_name: honeycomb-web
    restart: unless-stopped
    networks: [honeycomb-net]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HONEYCOMB_BIND:-127.0.0.1:8800}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/honeycomb.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
